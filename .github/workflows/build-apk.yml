name: Build S.AI 1.01 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, sai-v1.01-rebuild ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Python backend syntax
        run: python -m py_compile server/cloud/main.py server/ai/main.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35 and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 26 "$APK"
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          echo "$BADGING"
          echo "$BADGING" | grep -E "package: name='com\.scrami\.ai'.*versionName='1.01'"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: SAI-1.01-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
