name: Build SCRAMI AI APK
on:
  workflow_dispatch:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Download bundled local model (build-time only)
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 --retry-delay 2 \
            -o app/src/main/assets/qwen2.5-0.5b-instruct-q4_0.gguf \
            https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_0.gguf
          test "$(stat -c%s app/src/main/assets/qwen2.5-0.5b-instruct-q4_0.gguf)" -gt 400000000
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Static security checks
        run: |
          ! grep -RniE 'http://|android:allowBackup="true"|usesCleartextTraffic="true"|SECRET|api[_-]?key' app/src/main || (echo "Security check failed"; exit 1)
      - name: Verify APK exists
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SCRAMI-AI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
