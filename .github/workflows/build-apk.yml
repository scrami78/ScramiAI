name: Build SCRAMI AI APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Download bundled Qwen model
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 5 --retry-delay 3 -o app/src/main/assets/qwen2.5-0.5b-instruct-q4_k_m.gguf https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
          test -s app/src/main/assets/qwen2.5-0.5b-instruct-q4_k_m.gguf
          SIZE=$(stat -c%s app/src/main/assets/qwen2.5-0.5b-instruct-q4_k_m.gguf)
          echo "Bundled model bytes: $SIZE"
          test "$SIZE" -gt 450000000
      - name: Build verified APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 26 "$APK"
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          echo "$BADGING"
          echo "$BADGING" | grep -E "package: name='com\.scrami\.ai'.*versionName='7\.0'"
          unzip -l "$APK" | grep -q "assets/qwen2.5-0.5b-instruct-q4_k_m.gguf"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: SCRAMI-AI-7.0
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


      - name: Publish S.AI 7.0 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v7.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload v7.0 app/build/outputs/apk/debug/app-debug.apk --repo "${{ github.repository }}" --clobber
            gh release edit v7.0 --repo "${{ github.repository }}" --draft=false --title "S.AI 7.0"
          else
            gh release create v7.0 \
              --repo "${{ github.repository }}" \
              --title "S.AI 7.0" \
              --notes "S.AI 7.0 — Kotlin + C++ native core, local GGUF inference, free S.AI Core integration, and verified APK build." \
              --target "${{ github.sha }}" \
              app/build/outputs/apk/debug/app-debug.apk
          fi
