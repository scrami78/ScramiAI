name: Build S.AI 7.2 APK
on:
  push:
    branches:
      - main
    paths:
      - 'app/src/main/res/drawable/scrami_icon.xml'
      - '.github/workflows/build-sai-7-2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout S.AI 7.2
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAI-7.2-icon-fixed
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
