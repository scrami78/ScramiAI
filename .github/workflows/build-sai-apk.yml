name: Build S.AI APK
on:
  push:
    branches:
      - sai-v1.01-rebuild
    paths:
      - 'app/src/main/res/drawable/scrami_icon_foreground.xml'
      - 'app/src/main/res/values/colors.xml'
      - '.github/workflows/build-sai-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: sai-v1.01-rebuild
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAI-icon-fixed-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
